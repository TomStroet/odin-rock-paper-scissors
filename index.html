<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="scoreboard">
        <h2>Score</h2>
        <p>You: <span class="humanScore">0</span></p>
        <p>Computer: <span class="computerScore">0</span></p>
    </div>
    <div class="rounds">
        <div class="round">
            <div id="buttons">
                <button>Rock</button>
                <button>Paper</button>
                <button>Scissors</button>
            </div>
            <div class="results"></div>
                <div class="choices"></div>
                <div class="result"></div>
        </div>
    </div>    
    <script src="script.js"></script>
</body>
</html>
